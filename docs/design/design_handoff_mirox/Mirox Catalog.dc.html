<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  html,body{margin:0;padding:0;background:#000;color:#fff;font-family:'Manrope',sans-serif;}
  a{color:#fff;text-decoration:none;}
  a:hover{color:#d4d4d4;}
</style>
</helmet>
<div style="background:#000;color:#fff;font-family:'Manrope',sans-serif;min-height:100vh">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:32px;padding:18px 48px;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(12px);z-index:50">
    <a href="Mirox Home.dc.html" style="display:inline-flex;align-items:center;gap:10px">
      <img src="images/logo.png" alt="Mirox Shop" style="height:42px;display:block">
    </a>
    <nav style="display:flex;gap:28px;font-size:14px;font-weight:600;flex-shrink:0;white-space:nowrap">
      <a href="Mirox Catalog.dc.html" style="color:#fff">Каталог</a>
      <a href="Mirox Catalog.dc.html" style="color:#a3a3a3" style-hover="color:#fff">Новинки</a>
      <a href="Mirox Catalog.dc.html" style="color:#a3a3a3" style-hover="color:#fff">Бестселери</a>
      <a href="Mirox Contacts.dc.html" style="color:#a3a3a3" style-hover="color:#fff">Про нас</a>
      <a href="Mirox Contacts.dc.html" style="color:#a3a3a3" style-hover="color:#fff">Доставка</a>
      <a href="Mirox Contacts.dc.html" style="color:#a3a3a3" style-hover="color:#fff">Контакти</a>
    </nav>
    <div style="display:flex;gap:18px;align-items:center;flex-shrink:0">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.5-4.5"></path></svg>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"></path></svg>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5l-7.2-7.2a4.8 4.8 0 0 1 6.8-6.8l.4.4.4-.4a4.8 4.8 0 0 1 6.8 6.8z"></path></svg>
      <a href="Mirox Cart.dc.html" style="position:relative;display:inline-flex">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
        <span style="position:absolute;top:-6px;right:-8px;background:#fff;color:#000;font-size:10px;font-weight:800;border-radius:99px;padding:1px 5px">2</span>
      </a>
    </div>
  </header>

  <section style="padding:48px 80px 80px">
    <div style="font-size:12.5px;color:#737373;margin-bottom:10px"><a href="Mirox Home.dc.html" style="color:#737373" style-hover="color:#fff">Головна</a> / <span style="color:#a3a3a3">Каталог</span></div>
    <h1 style="margin:0 0 28px;font-size:40px;font-weight:800;letter-spacing:-0.02em">Каталог</h1>

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:32px">
      <span style="display:inline-flex;align-items:center;gap:8px;border:1px solid #333;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Фільтри
      </span>
      <span style="border:1px solid #262626;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;color:#a3a3a3">Ціна ▾</span>
      <span style="border:1px solid #262626;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;color:#a3a3a3">Бренд ▾</span>
      <div style="display:flex;gap:6px;border:1px solid #262626;border-radius:10px;padding:5px 8px;align-items:center">
        <span style="font-size:13px;font-weight:600;color:#a3a3a3;padding:0 6px">Розмір:</span>
        <sc-for list="{{ sizes }}" as="sz" hint-placeholder-count="4">
          <button onClick="{{ sz.toggle }}" style="background: {{ sz.bg }};color: {{ sz.color }};border:1px solid #333;border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit">{{ sz.label }}</button>
        </sc-for>
      </div>
      <span style="border:1px solid #262626;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;color:#a3a3a3">Колір ▾</span>
      <span style="border:1px solid #262626;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;color:#a3a3a3">Наявність ▾</span>
      <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
        <span style="font-size:13px;color:#737373;font-weight:600">Сортування:</span>
        <sc-for list="{{ sorts }}" as="st" hint-placeholder-count="3">
          <button onClick="{{ st.select }}" style="background: {{ st.bg }};color: {{ st.color }};border:1px solid #333;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit">{{ st.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px">
      <sc-for list="{{ items }}" as="p" hint-placeholder-count="8">
        <a href="Mirox Product.dc.html" style="display:block;background:#0d0d0d;border:1px solid #1a1a1a;border-radius:16px;overflow:hidden" style-hover="border-color:#333;color:#fff">
          <div style="position:relative;height:280px">
            <image-slot id="{{ p.slotId }}" src="{{ p.src }}" shape="rect" placeholder="{{ p.name }}"></image-slot>
            <sc-if value="{{ p.badge }}" hint-placeholder-val="{{ false }}">
              <span style="position:absolute;top:12px;left:12px;background: {{ p.badgeBg }};color: {{ p.badgeColor }};border:1px solid #333;font-size:10.5px;font-weight:800;letter-spacing:0.05em;padding:4px 10px;border-radius:99px;pointer-events:none">{{ p.badge }}</span>
            </sc-if>
          </div>
          <div style="padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px">
            <div style="font-size:14.5px;font-weight:700">{{ p.name }}</div>
            <div style="display:flex;gap:8px;align-items:baseline">
              <span style="font-size:15px;font-weight:800">{{ p.price }} грн</span>
              <sc-if value="{{ p.oldPrice }}" hint-placeholder-val="{{ false }}"><span style="font-size:12.5px;color:#737373;text-decoration:line-through">{{ p.oldPrice }} грн</span></sc-if>
            </div>
            <div style="font-size:11.5px;color:#a3a3a3;font-weight:600">{{ p.sizesLabel }}</div>
          </div>
        </a>
      </sc-for>
    </div>
    <div style="display:flex;justify-content:center;gap:8px;margin-top:40px;color:#a3a3a3;font-size:13.5px;font-weight:700">
      <span style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #333;border-radius:9px;background:#fff;color:#000">1</span>
      <span style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #262626;border-radius:9px">2</span>
      <span style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #262626;border-radius:9px">→</span>
    </div>
  </section>

  <footer style="display:flex;justify-content:space-between;align-items:center;padding:20px 80px;color:#737373;font-size:12.5px;border-top:1px solid #1a1a1a">
    <span>© 2026 Mirox Shop</span>
    <div style="display:flex;gap:24px">
      <a href="Mirox Contacts.dc.html" style="color:#737373" style-hover="color:#fff">Доставка та оплата</a>
      <a href="Mirox Contacts.dc.html" style="color:#737373" style-hover="color:#fff">Контакти</a>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { size: null, sort: "new" };
  products = [
    { slotId: "p-hudi-basic", name: "Худі Mirox Basic", price: 1290, oldPrice: null, badge: "НОВИНКА", light: true, sizes: ["S","M","L","XL"], added: 8 },
    { slotId: "p-tshirt", name: "Футболка Mirox", price: 590, oldPrice: 690, badge: "-15%", light: false, sizes: ["S","M","L","XL"], added: 5 },
    { slotId: "p-olimp", name: "Олімпійка Mirox", price: 1490, oldPrice: null, badge: null, light: false, sizes: ["S","M","L","XL"], added: 4 },
    { slotId: "p-hudi-white", name: "Худі Mirox White", price: 1290, oldPrice: 1490, badge: "-15%", light: false, sizes: ["S","M","L","XL"], added: 7 },
    { slotId: "p-hudi-oversize", name: "Худі Mirox Oversize", price: 1390, oldPrice: null, badge: "НОВИНКА", light: true, sizes: ["M","L","XL","XXL"], added: 9 },
    { slotId: "p-cargo", name: "Штани Mirox Cargo", price: 1190, oldPrice: null, badge: null, light: false, sizes: ["S","M","L"], added: 3 },
    { slotId: "p-longsleeve", name: "Лонгслів Mirox", price: 690, oldPrice: null, badge: null, light: false, sizes: ["S","M","L","XL"], added: 2 },
    { slotId: "p-cap", name: "Кепка Mirox", price: 490, oldPrice: null, badge: null, light: false, sizes: ["One size"], added: 6 },
  ];
  renderVals() {
    const { size, sort } = this.state;
    let list = this.products.filter(p => !size || p.sizes.includes(size));
    list = [...list].sort((a, b) => sort === "asc" ? a.price - b.price : sort === "desc" ? b.price - a.price : b.added - a.added);
    return {
      items: list.map(p => ({
        ...p,
        src: "images/" + p.slotId + ".png",
        badgeBg: p.light ? "#fff" : "#1a1a1a",
        badgeColor: p.light ? "#000" : "#fff",
        sizesLabel: p.sizes.join(" · "),
      })),
      sizes: ["S","M","L","XL","XXL"].map(label => ({
        label,
        bg: size === label ? "#fff" : "transparent",
        color: size === label ? "#000" : "#a3a3a3",
        toggle: (e) => { e.preventDefault(); this.setState({ size: size === label ? null : label }); },
      })),
      sorts: [["new","Новинки"],["asc","Ціна ↑"],["desc","Ціна ↓"]].map(([id,label]) => ({
        label,
        bg: sort === id ? "#fff" : "transparent",
        color: sort === id ? "#000" : "#a3a3a3",
        select: () => this.setState({ sort: id }),
      })),
    };
  }
}
</script>
</body>
</html>
